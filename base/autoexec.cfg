//-------- 12. Game / saves / input & misc -----------------------------------
seta g_showHud "1"
seta ui_showGun "1"
seta com_disableAutoSaves "1"    // framework/Session.cpp - autosaves stall on virtio-blk
seta developer "0"               // framework/SysCvar.cpp - keep developer mode off (less log spam)
seta sensitivity "5"             // framework/UsercmdGen.cpp - mouse sensitivity (no mouse on the demo)

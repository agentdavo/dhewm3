//-------- 9. Memory & caching -----------------------------------------------
// idTech4 caches decompressed images/models between levels, purging forces
// expensive CPU re-decompression. Keep caches resident, pools modest.
seta com_purgeAll "0"            // framework/Common.cpp
seta image_useCache "1"          // renderer/Image_init.cpp - background image-load thread off
seta image_cacheMegs "256"       // renderer/Image_init.cpp
seta image_cacheMinK "3072"      // renderer/Image_init.cpp - min image size (KB) eligible for the background cache
seta r_vertexBufferMegs "32"     // renderer/VertexCache.cpp - gl4es emulates VBOs in system RAM
seta com_preciseTic "1"          // framework/Common.cpp - precise frame timing


//-------- 10. Sound ---------------------------------------------------------
seta s_maxSoundsPerShader "1"
seta s_useEAXReverb "0"          // sound/snd_system.cpp
seta s_useOcclusion "0"          // sound/snd_system.cpp - drop per-frame occlusion tracing (CPU cost)
seta s_clipVolumes "1"           // sound/snd_system.cpp - cull inaudible sounds (saves mixing)
seta s_playDefaultSound "0"
seta s_numberOfSpeakers "2"      // sound/snd_system.cpp - stereo (virtio-snd)
seta s_subFraction "0.75"        // sound/snd_system.cpp
seta s_reverse "0"               // sound/snd_system.cpp



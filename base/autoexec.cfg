seta g_fov "90"                  // game/gamesys/SysCvar.cpp
seta g_gravity "1066"            // game/gamesys/SysCvar.cpp
seta g_skill "1"                 // game/gamesys/SysCvar.cpp - 0=easy..3=nightmare

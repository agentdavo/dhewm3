//============================================================================
// Bare-metal dOS autoexec.cfg
//
// Staged into the disk image by riscv/image/mkimage.sh, executes after the pk4
// default.cfg and dhewm.cfg, so these win over engine defaults. Command-line
// +set values still win over this file. Bare metal forces com_machineSpec 0
// (Low) for workload options; the startup texture override runs after
// each preset and config load — they are kept for documentation.
//
// Every cvar here is verified present in the dhewm3 source (neo/). Sections:
//   1. Display & framebuffer        7. Renderer - pass skips (debug)
//   2. Gamma & colour               8. Renderer - debug visualisers
//   3. Performance monitoring        9. Memory & caching
//   4. Renderer - culling/workload  10. Sound
//   5. Renderer - features/quality  11. Game - cosmetic cost
//   6. Images & textures            12. Input & misc
//============================================================================


//-------- 1. Display & framebuffer ------------------------------------------
// Small deterministic surface for serial/virtio-gpu capture. No real display,
// so fullscreen/MSAA/vsync are meaningless, pinned off.
// 768x432: exact 16:9, and aligned to the softgles2 SIMT backend — width 768 =
// 12*64 (one e32m2 warp = 64 px, no scanline tail) and height 432 = 27*16 (one
// MT tile = 64x16, no partial tile row). r_mode -1 activates the custom size.
seta r_mode "-1"
seta r_customWidth "768"         // renderer/RenderSystem_init.cpp - 12 * SGL_SIMT_LANES(64)
seta r_customHeight "432"        // renderer/RenderSystem_init.cpp - 27 * SGL_MT_TILE_H(16)
seta r_fullscreen "0"
seta r_fullscreenDesktop "0"
seta r_multiSamples "0"
seta r_swapInterval "0"
seta r_clear "2"                 // renderer/RenderSystem_init.cpp - clear colour buffer each frame (no stale garbage)
seta r_aspectRatio "-1"          // game/gamesys/SysCvar.cpp - -1 = auto (picks 16:9 for 768x432)
seta r_screenFraction "100"      // renderer/RenderSystem_init.cpp - 100 = full-res, lower = subsampled (perf debug only)


//-------- 2. Gamma & colour -------------------------------------------------
// Bare metal has no hardware gamma ramp, correction lives in the shader path.
// engine_kmain.c also sets these at boot so QEMU/windowed runs use the same curve.
seta r_gammaInShader "1"
seta r_gamma "1.1"
seta r_brightness "1.0"


//-------- 3. Performance monitoring & profiling -----------------------------
// Doom 3's built-in instrumentation. The TEXT/console readouts below are safe
// to leave on (they print, they don't alter the frame). The VISUAL overlays
// that recolour/redraw the scene live in section 8, commented, since they
// change what softgles2 rasterises.
seta com_speeds "1"              // framework/Common.cpp - per-frame frontend/backend/gpu/game ms
seta com_showFPS "1"             // framework/Common.cpp - FPS counter
// bm_renderProf (softgles2 [rprof] + [fssrc]/[fsdump]/[fswork] shader-workload
// dump, Phase 0 archetype discovery) is build-controlled: configure with
// -DBAREMETAL_RENDER_PROF=1. engine_kmain.c emits a +set that overrides autoexec,
// so it is set there (via the build flag), not here.
seta s_noSound "1"               // sound/snd_system.cpp - silence audio. The bare-metal
//   audio backend base64-dumps PCM over serial (dos_audio.c),
//   throttling the run to ~12s/frame, off for headless capture.
seta g_skipCinematic "0"         // play the intro cinematic (set "1" to headless auto-skip, cvar default is 0)
//   (no ESC input), fast-forwards to the lit world so in-game
//   frames render instead of the cinematic 2D overlay forever.
seta com_timestampPrints "0"     // framework/Common.cpp - prefix console prints with ms (0=off,1=s,2=ms)
seta r_showPrimitives "1"        // renderer/RenderSystem_init.cpp - drawsurf/index/vertex counts per frame
seta r_showSmp "0"               // renderer/RenderSystem_init.cpp - frontend/backend SMP overlap (our SMP is the softgles2 harts)
seta r_showMemory "0"            // renderer/RenderSystem_init.cpp - per-frame frame-data memory use
seta r_showDynamic "0"           // renderer/RenderSystem_init.cpp - dynamically-generated surfaces
seta r_showCull "0"              // renderer/RenderSystem_init.cpp - cull counts (front-end discard effectiveness)
seta r_showInteractions "0"      // renderer/RenderSystem_init.cpp - light/surface interaction counts
seta r_showLightCount "0"        // renderer/RenderSystem_init.cpp - lights touching each pixel
seta r_showShadowCount "0"       // renderer/RenderSystem_init.cpp - shadow-volume counts
seta r_showSurfaceInfo "0"       // renderer/RenderSystem_init.cpp - material under the crosshair
seta r_showDefs "0"              // renderer/RenderSystem_init.cpp - entity/light def counts
seta r_showUpdates "0"           // renderer/RenderSystem_init.cpp - entity/light update counts
seta r_showTrace "0"             // renderer/RenderSystem_init.cpp - ray-trace counts
seta g_frametime "0"             // game/gamesys/SysCvar.cpp - print game-think ms per frame
seta g_showviewpos "0"           // game/gamesys/SysCvar.cpp - print view origin/angles


//-------- 4. Renderer - culling & workload (software-raster perf) -----------
// Fill-rate (pixels touched by the fragment VM) is the CPU rasteriser's
// bottleneck, so anything that tightens scissors or culls geometry in the
// front-end is a direct win. These are mostly engine defaults, pinned to
// document intent and guard against an overriding cfg.
seta r_useEntityScissors "1"     // renderer/RenderSystem_init.cpp:142 (default 0, per-entity scissor = fewer frags)
seta r_finish "0"                // renderer/RenderSystem_init.cpp - never glFinish (no GPU to stall on)
seta r_useScissor "1"            // renderer/RenderSystem_init.cpp - scissor to light bounds
seta r_useLightScissors "1"      // renderer/RenderSystem_init.cpp
seta r_useCulling "2"            // renderer/RenderSystem_init.cpp - 2 = sphere + box
seta r_useLightCulling "3"       // renderer/RenderSystem_init.cpp - 3 = box + exact + areas
seta r_useShadowCulling "1"      // renderer/RenderSystem_init.cpp
seta r_useShadowProjectedCull "1"// renderer/RenderSystem_init.cpp
seta r_useTurboShadow "1"        // renderer/RenderSystem_init.cpp
seta r_useOptimizedShadows "1"   // renderer/RenderSystem_init.cpp
seta r_useTwoSidedStencil "1"    // renderer/RenderSystem_init.cpp - one pass instead of two for stencil shadows
seta r_useInteractionTable "1"   // renderer/RenderSystem_init.cpp
seta r_useNodeCommonChildren "1" // renderer/RenderSystem_init.cpp
seta r_useConstantMaterials "1"  // renderer/RenderSystem_init.cpp - skip re-eval of constant material expressions
seta r_useSilRemap "1"           // renderer/RenderSystem_init.cpp - silhouette vertex remap for shadow volumes
seta r_orderIndexes "1"          // renderer/RenderSystem_init.cpp - vertex-cache-friendly index order
seta r_useDeferredTangents "1"   // renderer/RenderSystem_init.cpp
seta r_useCachedDynamicModels "1"// renderer/RenderSystem_init.cpp
seta r_useStateCaching "1"       // renderer/RenderSystem_init.cpp - drop redundant GL_*() calls
// --- remaining r_use* toggles, pinned explicitly at their engine defaults so
//     the full set lives in one place. Behaviour-neutral (these ARE the runtime
//     defaults), all are front-end culling/scissor work that cuts draws and
//     fragments touched by the fragment VM — pure win for the software raster. ---
seta r_useEntityCulling "1"               // box-cull entities (default 1)
seta r_useInteractionCulling "1"          // cull light<->surface interactions (default 1)
seta r_useInteractionScissors "2"         // per-interaction scissor + portal crop (default 2)
seta r_useClippedLightScissors "1"        // exact light scissor when near-clipped (default 1)
seta r_useShadowSurfaceScissor "1"        // scissor shadows to interaction surface rect (default 1)
seta r_useExternalShadows "1"             // skip shadow caps outside the light volume (default 1)
seta r_usePortals "1"                     // portal area culling, else draw everything (default 1)
seta r_useLightPortalFlow "1"             // precise area-reference determination (default 1)
seta r_useEntityCallbacks "1"             // defer entity model updates to draw time (default 1)
seta r_useFrustumFarDistance "0"          // 0 = no forced view-frustum far distance (default 0)
seta r_usePreciseTriangleInteractions "0" // 0 = skip costly per-tri winding-clip lighting (default 0)
// stencil-shadow path (Doom 3's signature, kept on and now stencil-optimised in softgles2):
seta r_useCarmacksReverse "1"             // Z-fail (Carmack's Reverse) stencil shadows (default 1)
seta r_useStencilOpSeparate "1"           // single-pass two-sided stencil, GLES2-supported (default 1)
// geometry submission:
seta r_useVertexBuffers "1"               // VBOs via gl4es (default 1)
seta r_useIndexBuffers "0"                // client index arrays, no IBO (default 0)
seta r_useInfiniteFarZ "1"                // no-far-clip-plane projection trick (default 1)
seta r_useCombinerDisplayLists "1"        // legacy NV register combiners, no-op via gl4es/GLES2 (default 1)
seta r_lightAllBackFaces "0"     // renderer/RenderSystem_init.cpp - leave off (extra lit fragments otherwise)
// GPU-extension fast paths: no-ops on software (gated on an unadvertised GL
// extension), pinned off so no time is wasted probing them.
seta r_useDepthBoundsTest "0"    // renderer/RenderSystem_init.cpp - EXT_depth_bounds_test (NVIDIA)
seta r_useShadowVertexProgram "0"// renderer/RenderSystem_init.cpp - ARB vertex-program shadow projection


//-------- 5. Renderer - features & quality ----------------------------------
// Keep Doom 3's lighting + stencil-shadow path intact (the point of the port).
seta r_shadows "1"
seta r_skipSpecular "0"
seta r_skipBump "0"
seta r_skipNewAmbient "0"
seta r_useSoftParticles "0"      // avoid render-to-texture the software path can't do cheaply
seta r_enableDepthCapture "0"    // avoid depth render-to-texture
seta r_lightScale "2"            // renderer/RenderSystem_init.cpp - overbright factor (2 = stock D3 look)
seta r_znear "3"                 // game/gamesys/SysCvar.cpp - near clip plane (stock 3)
seta r_offsetfactor "0"          // renderer/RenderSystem_init.cpp - polygon depth-offset slope (decals/coplanar)
seta r_offsetunits "-600"        // renderer/RenderSystem_init.cpp - polygon depth-offset bias (stock)


//-------- 6. Images & textures ----------------------------------------------
// Low machine-spec policy (the bare-metal init forces these via execMachineSpec
// too). Downsizing shrinks textures -> less sample/memory cost on the CPU.
seta com_machineSpec "0"
seta image_anisotropy "0"        // no GPU anisotropic filtering
seta image_filter "GL_LINEAR_MIPMAP_LINEAR"
seta image_lodbias "0"           // framework/Common.cpp
seta image_roundDown "1"         // round non-POT to the lower POT
seta image_preload "1"
seta image_useAllFormats "0"
seta image_usePrecompressedTextures "0"
seta image_useCompression "0"    // uncompressed RGB8/RGBA8 source textures
seta image_useNormalCompression "0"
seta image_downSize "0"
seta image_downSizeLimit "256"       // inactive while image_downSize=0
seta image_downSizeSpecular "0"
seta image_downSizeBump "0"
seta image_downSizeSpecularLimit "64"
seta image_downSizeBumpLimit "256"
seta image_forceDownSize "0"         // renderer/Image_init.cpp - 1 = downsize even nopicmip materials (GUI/menu bgs). Off keeps menus sharp.
seta image_ignoreHighQuality "0"
// Texture-writing / offline-compression tooling: pinned OFF. These write .tga/
// .dds files to disk, which the read-only bare-metal dosfs cannot do.
seta image_writeTGA "0"              // renderer/Image_files.cpp
seta image_writeNormalTGA "0"        // renderer/Image_files.cpp
seta image_writeNormalTGAPalletized "0" // renderer/Image_files.cpp
seta image_writePrecompressedTextures "0" // renderer/Image_files.cpp
seta image_useOfflineCompression "0" // renderer/Image_files.cpp
// Debug visualisers (commented, recolour textures):
//seta image_colorMipLevels "1"      // renderer/Image_init.cpp - tint each mip level a colour
//seta image_showBackgroundLoads "1" // renderer/Image_init.cpp - log background image loads


